name: eng-inv-manager

services:
  backend:
    build:
      context: ./backend
    command: ["sh", "-c", "python cleaning.py && fastapi dev main.py --host 0.0.0.0 --port 8080"]
    # run as the host owner so the bind-mounted data directory is writable
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      # keep the container's virtualenv instead of the host's
      - backend_venv:/app/.venv

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # keep the container's node_modules instead of the host's
      - frontend_node_modules:/app/node_modules

volumes:
  backend_venv:
  frontend_node_modules:
